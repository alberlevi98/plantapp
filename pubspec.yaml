name: plantapp
description: HUBX Flutter Developer Case — PlantApp onboarding, paywall and home flows.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  stream_transform: ^2.1.0
  equatable: ^2.0.5

  # Networking & serialization
  dio: ^5.7.0
  json_annotation: ^4.9.0
  freezed_annotation: ^3.1.0

  # Routing & DI
  auto_route: ^11.1.0
  get_it: ^9.2.1

  # Platform / storage / media
  shared_preferences: ^2.3.2
  connectivity_plus: ^7.3.1
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.13
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.8.0
  auto_route_generator: ^10.6.0

  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/images/get_started/
    - assets/images/onboarding/
    - assets/images/paywall/
    - assets/images/home/
    - assets/images/home/tab_icons/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Light.ttf
          weight: 300
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  # `dart run flutter_launcher_icons` reads this block and generates every
  # mipmap/AppIcon.appiconset resolution Android and iOS need from the one
  # source file below.
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  # Android 13+ themed/adaptive icons: a separate foreground with safe
  # padding, layered over a plain background color. Optional — drop these
  # two lines if app_icon.png isn't already padded for that use, and
  # launcher_icons will just use image_path for both legacy and adaptive.
  adaptive_icon_background: "#101E17"
  adaptive_icon_foreground: "assets/images/app_icon.png"